name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npm test
      - name: Tipos
        run: npm run typecheck
      - name: Migraciones y seed en Postgres embebido (PGlite)
        run: npm run db:validar
      - name: Build de Next
        run: npm run build
        env:
          # El build no necesita la base; con valores vacios las paginas se marcan como dinamicas
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
