name: Scrapers

on:
  schedule:
    - cron: "15 3 * * *"   # Carrefour: todos los dias a las 03:15 UTC
    - cron: "45 4 * * *"   # Ahorramas: todos los dias a las 04:45 UTC
    - cron: "15 5 * * 1-6" # Gadis: de lunes a sabado solo categorias (--rapido, ~10 min)
    - cron: "15 5 * * 0"   # Gadis: los domingos completo (categorias + fichas, ~2 h)
    # Caprabo no va aqui: desde el 2026-10-24 responde 403 a las IPs de GitHub (bloqueo de
    # centros de datos; no se salta). Se carga a mano desde casa: npm run scraper -- caprabo
    - cron: "30 2 * * 1"   # Mercadona: los lunes a las 02:30 UTC (catalogo, sin precios)
  workflow_dispatch:
    inputs:
      supermercado:
        description: "Supermercado (carrefour | mercadona | ahorramas | gadis | caprabo)"
        default: "carrefour"
      opciones:
        description: "Opciones extra (p. ej. --rapido o --max-peticiones 50)"
        default: ""

concurrency:
  group: scrapers-${{ github.event.schedule || inputs.supermercado }}
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Carrefour tarda ~2 h; el 2026-10-27 se colgo y llego a 3 h
    env:
      SUPER: >-
        ${{ github.event.schedule == '30 2 * * 1' && 'mercadona'
         || github.event.schedule == '45 4 * * *' && 'ahorramas'
         || startsWith(github.event.schedule, '15 5 ') && 'gadis'
         || inputs.supermercado || 'carrefour' }}
    steps:
      - name: Comprobar secretos
        # Sin estos secretos el job fallaria a los pocos segundos con un error poco claro
        run: |
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then
            echo "::error title=Faltan secretos::Crea SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY en Settings > Secrets and variables > Actions"
            exit 1
          fi
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar scraper
        # Sale con codigo 2 si hay alerta de calidad (0 productos o caida >= 30 %):
        # GitHub marca el job como fallido y envia un email.
        run: npm run scraper -- "$SUPER" $OPCIONES
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPCIONES: ${{ github.event.schedule == '15 5 * * 1-6' && '--rapido' || inputs.opciones }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT || 'Eat-em/0.1 (uso personal)' }}
